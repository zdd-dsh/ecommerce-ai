spring:
  # 多环境配置
  profiles:
    active: dev

  # 编码配置（解决中文乱码）
    http:
      encoding:
        charset: UTF-8
        enabled: true
        force: true

  # Redis缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 1800000
      cache-null-values: false

# 服务端口
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.example.book.entity
  configuration:
    map-underscore-to-camel-case: true

# 日志级别（关掉SQL调试日志，只看输出结果）
logging:
  level:
    com.example.book: info
    com.example.book.mapper: info
    root: info

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health
